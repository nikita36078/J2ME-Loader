name: Build Bo lac thoi tien su APK

on:
  push:
    branches:
      - feature/bo-lac-thoi-tien-su-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build standalone debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleOpenDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Bo-lac-thoi-tien-su-APK
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Install and launch game in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            APK="$(find app/build/outputs -name '*.apk' -print -quit)"; echo "APK path: ${APK:-NOT_FOUND}"; test -n "$APK" || { echo "No APK found under app/build/outputs"; find app/build/outputs -maxdepth 7 -print; exit 1; }; attempt=1; while [ "$attempt" -le 3 ]; do echo "Emulator launch attempt $attempt/3"; if adb install -r "$APK" && adb shell am force-stop com.tuananh.bolacthoitiensu.debug && adb shell am start -n com.tuananh.bolacthoitiensu.debug/ru.playsoftware.j2meloader.MainActivity; then sleep 30; adb shell dumpsys activity activities > /tmp/activities.txt; if grep -q "javax.microedition.shell.MicroActivity" /tmp/activities.txt; then echo "PASS: embedded game activity is visible"; adb logcat -d -t 3000 | grep -E "FATAL EXCEPTION|Dexing error|No MIDlets found|tribes" || true; exit 0; fi; fi; echo "Attempt $attempt did not reach the game activity; collecting diagnostics"; adb logcat -d -t 4000 > /tmp/game-logcat.txt; tail -n 180 /tmp/game-logcat.txt; cat /tmp/activities.txt 2>/dev/null || true; attempt=$((attempt+1)); sleep 10; done; echo "FAIL: game activity was not reached after 3 attempts"; exit 1
