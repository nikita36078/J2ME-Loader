name: Build Bo lac thoi tien su APK

on:
  push:
    branches:
      - feature/bo-lac-thoi-tien-su-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build standalone debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleOpenDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Bo-lac-thoi-tien-su-APK
          path: app/build/outputs/apk/open/debug/*.apk
          if-no-files-found: error
          retention-days: 14
