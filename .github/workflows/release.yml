name: Automated CI builds

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;25.1.8937393"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Decode Android keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEY }}
          ENCODED_PROPS: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$ENCODED_KEYSTORE" ] || [ -z "$ENCODED_PROPS" ]; then
            echo "::error::Set repository secrets SIGNING_KEY and KEYSTORE_PROPERTIES"
            exit 1
          fi
          printf '%s' "$ENCODED_KEYSTORE" | base64 -di > app/keystore.jks
          printf '%s' "$ENCODED_PROPS" | base64 -di > keystore.properties

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleOpenRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/open/release/*.apk dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk

      - name: Upload APKs
        uses: tcnksm/ghr@v0
        with:
          tag: continuous
          path: dist
          delete: "true"
          name: "Automated CI builds"
