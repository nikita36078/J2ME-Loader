# Builds the `open` flavor APKs (debug + release) on every push and on demand.
# Pushing a tag starting with "v" additionally creates a GitHub Release with the
# signed release APK attached.
#
# Release signing (optional): if you want releases signed with your own key,
# define these repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   base64 of your keystore file
#                     (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.keystore")) > b64.txt)
#   KEYSTORE_PASSWORD keystore password
#   KEY_ALIAS         key alias
#   KEY_PASSWORD      key password
# Without them a throwaway self-signed keystore is generated, so the APK is
# installable but cannot upgrade an existing installation signed with another key.

name: Build APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build open flavor
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create GitHub Releases on tag pushes

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history: generateVersionCode() counts git revisions
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Using release keystore from secrets"
          else
            keytool -genkeypair \
              -keystore app/ci.keystore \
              -storetype PKCS12 \
              -alias ci \
              -keyalg RSA -keysize 2048 \
              -validity 10950 \
              -storepass j2meloader -keypass j2meloader \
              -dname "CN=J2ME Loader CI"
            {
              echo "storeFile=ci.keystore"
              echo "storePassword=j2meloader"
              echo "keyAlias=ci"
              echo "keyPassword=j2meloader"
            } > keystore.properties
            echo "::warning::No signing secrets configured, using a throwaway self-signed keystore"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew --no-daemon assembleOpenDebug assembleOpenRelease

      - name: List outputs
        run: find app/build/outputs/apk -name '*.apk' -printf '%p (%s bytes)\n'

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Loader-APK-r${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*release*.apk
          generate_release_notes: true
